name: R34F16 Canonical Dynamic Winner Acquisition

on:
  push:
    branches:
      - research/r34f13-event-disjoint-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-r34f16:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests

      - name: Execute canonical target-blind R34F16 winner runner
        run: python r34f16_runner_fix.py

      - name: Upload canonical R34F16 target-blind output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r34f16-targetblind-winner
          path: out_r34f16/
          if-no-files-found: error
          retention-days: 7
