name: R34F13 Event-Disjoint Transport

on:
  push:
    branches:
      - research/r34f13-event-disjoint-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-r34f13:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests

      - name: Execute target-blind COMPETITION transport runner
        run: python r34f13_runner.py

      - name: Execute target-blind QUIESCENCE transport runner
        run: python r34f13_quiescence_runner.py

      - name: Execute canonical target-blind R34F16 winner runner
        run: python r34f16_dynamic_winner_runner.py

      - name: Upload COMPETITION target-blind output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r34f13-targetblind-output
          path: out/
          if-no-files-found: error
          retention-days: 7

      - name: Upload QUIESCENCE target-blind output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r34f13-quiescence-targetblind-output
          path: out_quiescence/
          if-no-files-found: error
          retention-days: 7

      - name: Upload canonical R34F16 target-blind output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r34f16-targetblind-winner
          path: out_r34f16/
          if-no-files-found: error
          retention-days: 7
