name: R34F16R1 Available-Source Acquisition

on:
  push:
    branches:
      - research/r34f13-event-disjoint-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-r34f16r1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Execute target-blind R34F16R1 source-migration runner
        run: python r34f16_r1_run.py
      - uses: actions/upload-artifact@v4
        with:
          name: r34f16r1-targetblind-winner
          path: out_r34f16r1/
          if-no-files-found: error
          retention-days: 7
