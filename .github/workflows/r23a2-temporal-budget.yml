name: R23A2 temporal budget execution

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  execute:
    if: github.event.issue.title == 'RUN R23A2 TEMPORAL BUDGET OBSERVABLE'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r23a2-multiprocess-temporal-budget
          fetch-depth: 0
      - name: Publish STARTED marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          status = {
            'protocol_id': 'R23A2_P2_TEMPORAL_BUDGET_VALIDATION_v0_1',
            'state': 'STARTED',
            'issue_number': os.environ.get('ISSUE_NUMBER'),
            'workflow_run_id': os.environ.get('RUN_ID'),
            'started_at_utc': datetime.now(timezone.utc).isoformat(),
            'multiprocess_guardrail': 'P2 is one mechanism/state only; no dominant route or global classifier.'
          }
          open('r23a2/RUN_STATUS.json','w').write(json.dumps(status, indent=2)+'\n')
          PY
          git add r23a2/RUN_STATUS.json
          git commit -m 'mark R23A2 execution started'
          git push origin HEAD:agent/r23a2-multiprocess-temporal-budget
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: python -m pip install --upgrade pip numpy pandas scipy requests tabulate
      - name: Reconstruct frozen inputs and engine
        id: reconstruct
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import glob
          import pandas as pd
          files = sorted(glob.glob('r23a2/input_parts/input_events_part_*.csv'))
          assert len(files) == 5, files
          df = pd.concat([pd.read_csv(f) for f in files], ignore_index=True)
          assert len(df) == 203, len(df)
          assert df['event_id'].is_unique
          df.to_csv('r23a2/input_events.csv', index=False)
          PY
          cat r23a2/script_parts/run_r23a2_part_*.txt > r23a2/run_r23a2.py
          python -m py_compile r23a2/run_r23a2.py
      - name: Execute frozen R23A2
        id: execute
        if: steps.reconstruct.outcome == 'success'
        continue-on-error: true
        run: |
          rm -rf r23a2/output
          set -o pipefail
          python r23a2/run_r23a2.py \
            --input r23a2/input_events.csv \
            --output r23a2/output \
            --prereg r23a2/00_PREREGISTRATION.json \
            --amendment r23a2/00_EXECUTION_AMENDMENT.md \
            2>&1 | tee r23a2/RUN_LOG.txt
      - name: Publish final status and available outputs
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          outcomes = {
            'install': os.environ.get('INSTALL_OUTCOME'),
            'reconstruct': os.environ.get('RECONSTRUCT_OUTCOME'),
            'execute': os.environ.get('EXECUTE_OUTCOME')
          }
          state = 'SUCCEEDED' if outcomes['execute'] == 'success' else 'FAILED'
          status = {
            'protocol_id': 'R23A2_P2_TEMPORAL_BUDGET_VALIDATION_v0_1',
            'state': state,
            'issue_number': os.environ.get('ISSUE_NUMBER'),
            'workflow_run_id': os.environ.get('RUN_ID'),
            'finished_at_utc': datetime.now(timezone.utc).isoformat(),
            'step_outcomes': outcomes,
            'multiprocess_guardrail': 'P2 is one mechanism/state only; no dominant route or global classifier.'
          }
          open('r23a2/RUN_STATUS.json','w').write(json.dumps(status, indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r23a2/RUN_STATUS.json
          test ! -f r23a2/RUN_LOG.txt || git add r23a2/RUN_LOG.txt
          test ! -d r23a2/output || git add r23a2/output
          git commit -m 'record R23A2 execution status and outputs'
          git push origin HEAD:agent/r23a2-multiprocess-temporal-budget
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RECONSTRUCT_OUTCOME: ${{ steps.reconstruct.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
