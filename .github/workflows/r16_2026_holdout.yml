name: R16 2026 Blind Holdout

on:
  push:
    branches:
      - agent/r16-2026-holdout
    paths:
      - 'research/r16_2026_holdout/**'
      - '.github/workflows/r16_2026_holdout.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/r16_2026_holdout/**'
      - '.github/workflows/r16_2026_holdout.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '20260730'

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: research/r16_2026_holdout/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r research/r16_2026_holdout/requirements.txt
      - name: Execute frozen R16 on 2026 YTD
        run: python research/r16_2026_holdout/run_r16_2026.py
      - name: Package evidence
        if: always()
        run: |
          if [ -d artifacts/r16_2026_holdout_v0_1 ]; then
            tar -czf R16_2026_BLIND_HOLDOUT_v0_1.tar.gz artifacts/r16_2026_holdout_v0_1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R16_2026_BLIND_HOLDOUT_v0_1
          path: |
            artifacts/r16_2026_holdout_v0_1
            R16_2026_BLIND_HOLDOUT_v0_1.tar.gz
          if-no-files-found: error
          retention-days: 30
