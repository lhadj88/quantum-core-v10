name: R34F20 Coupled Multichannel Operator

on:
  push:
    branches:
      - research/r34f20-coupled-operator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-r34f20:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Execute target-blind R34F20 runner
        run: python r34f20_run.py
      - uses: actions/upload-artifact@v4
        with:
          name: r34f20-targetblind
          path: out_r34f20/
          if-no-files-found: error
          retention-days: 7
