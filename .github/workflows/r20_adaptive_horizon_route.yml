name: R20 Adaptive Horizon Route

on:
  push:
    branches:
      - agent/r20-adaptive-horizon-route
    paths:
      - 'research/r20_adaptive_horizon_route/**'
      - '.github/workflows/r20_adaptive_horizon_route.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/r20_adaptive_horizon_route/**'
      - '.github/workflows/r20_adaptive_horizon_route.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '20260731'

jobs:
  tribunal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct R20 code
        run: python research/r20_adaptive_horizon_route/bootstrap_payload.py
      - name: Fetch frozen exposed R18 and R19 feature artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r20_r18 /tmp/r20_r19
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lhadj88/quantum-core-v10/actions/artifacts/8780834888/zip -o /tmp/r18.zip
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lhadj88/quantum-core-v10/actions/artifacts/8781127304/zip -o /tmp/r19.zip
          unzip -q /tmp/r18.zip -d /tmp/r20_r18
          unzip -q /tmp/r19.zip -d /tmp/r20_r19
          R18_FILE=$(find /tmp/r20_r18 -type f -name '01_R18_FEATURE_TABLE.csv' | head -n 1)
          R19_FILE=$(find /tmp/r20_r19 -type f -name '01_R19_FEATURE_TABLE.csv' | head -n 1)
          test -n "${R18_FILE}" && test -n "${R19_FILE}"
          cp "${R18_FILE}" research/r20_adaptive_horizon_route/01_R18_FEATURE_TABLE.csv
          cp "${R19_FILE}" research/r20_adaptive_horizon_route/01_R19_FEATURE_TABLE.csv
          sha256sum research/r20_adaptive_horizon_route/01_R18_FEATURE_TABLE.csv research/r20_adaptive_horizon_route/01_R19_FEATURE_TABLE.csv
      - name: Verify syntax
        run: python -m py_compile research/r20_adaptive_horizon_route/run_r20.py
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r research/r20_adaptive_horizon_route/requirements.txt
      - name: Execute R20 tribunal
        run: python research/r20_adaptive_horizon_route/run_r20.py
      - name: Package evidence
        if: always()
        run: |
          if [ -d artifacts/r20_adaptive_horizon_route_v0_1 ]; then
            tar -czf R20_ADAPTIVE_HORIZON_ROUTE_v0_1.tar.gz artifacts/r20_adaptive_horizon_route_v0_1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R20_ADAPTIVE_HORIZON_ROUTE_v0_1
          path: |
            artifacts/r20_adaptive_horizon_route_v0_1
            R20_ADAPTIVE_HORIZON_ROUTE_v0_1.tar.gz
          if-no-files-found: error
          retention-days: 30
