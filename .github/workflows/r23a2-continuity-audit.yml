name: R23A2 continuity audit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  audit:
    if: github.event.issue.title == 'RUN R23A2 CONTINUITY AUDIT'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r23a2-multiprocess-temporal-budget
          fetch-depth: 0
      - name: Publish STARTED marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p r23a2/continuity_audit
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          status = {
            'audit_id': 'R23A2_CONTINUITY_AUDIT_v0_1',
            'state': 'STARTED',
            'issue_number': os.environ.get('ISSUE_NUMBER'),
            'workflow_run_id': os.environ.get('RUN_ID'),
            'started_at_utc': datetime.now(timezone.utc).isoformat(),
            'statistics_executed': False,
            'multiprocess_guardrail': 'Availability audit only; no process is validated or falsified.'
          }
          open('r23a2/continuity_audit/RUN_STATUS.json','w').write(json.dumps(status, indent=2)+'\n')
          PY
          git add r23a2/continuity_audit/RUN_STATUS.json
          git commit -m 'mark R23A2 continuity audit started'
          git push origin HEAD:agent/r23a2-multiprocess-temporal-budget
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: python -m pip install --upgrade pip numpy pandas requests
      - name: Reconstruct frozen input and audit engine
        id: reconstruct
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import glob
          import pandas as pd
          files = sorted(glob.glob('r23a2/input_parts/input_events_part_*.csv'))
          assert len(files) == 5, files
          df = pd.concat([pd.read_csv(f) for f in files], ignore_index=True)
          assert len(df) == 203, len(df)
          assert df['event_id'].is_unique
          df.to_csv('r23a2/input_events.csv', index=False)
          PY
          cat r23a2/audit_parts/audit_continuity_part_*.txt > r23a2/audit_continuity.py
          python -m py_compile r23a2/audit_continuity.py
      - name: Execute availability audit only
        id: audit
        if: steps.reconstruct.outcome == 'success'
        continue-on-error: true
        run: |
          rm -rf r23a2/continuity_audit
          mkdir -p r23a2/continuity_audit
          set -o pipefail
          python r23a2/audit_continuity.py \
            --input r23a2/input_events.csv \
            --output r23a2/continuity_audit \
            2>&1 | tee r23a2/continuity_audit/RUN_LOG.txt
      - name: Publish final audit status and outputs
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          outcomes = {
            'install': os.environ.get('INSTALL_OUTCOME'),
            'reconstruct': os.environ.get('RECONSTRUCT_OUTCOME'),
            'audit': os.environ.get('AUDIT_OUTCOME')
          }
          state = 'SUCCEEDED' if outcomes['audit'] == 'success' else 'FAILED'
          status = {
            'audit_id': 'R23A2_CONTINUITY_AUDIT_v0_1',
            'state': state,
            'issue_number': os.environ.get('ISSUE_NUMBER'),
            'workflow_run_id': os.environ.get('RUN_ID'),
            'finished_at_utc': datetime.now(timezone.utc).isoformat(),
            'step_outcomes': outcomes,
            'statistics_executed': False,
            'multiprocess_guardrail': 'Availability audit only; no process is validated or falsified.'
          }
          open('r23a2/continuity_audit/RUN_STATUS.json','w').write(json.dumps(status, indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r23a2/continuity_audit
          git commit -m 'record R23A2 continuity audit outputs'
          git push origin HEAD:agent/r23a2-multiprocess-temporal-budget
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RECONSTRUCT_OUTCOME: ${{ steps.reconstruct.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
