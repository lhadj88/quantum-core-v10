name: R22 Daily 16UTC Regime Field

on:
  push:
    branches:
      - agent/r22-daily-16utc-regime-field
    paths:
      - 'research/r22_daily_16utc_regime_field/**'
      - '.github/workflows/r22_daily_16utc_regime_field.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/r22_daily_16utc_regime_field/**'
      - '.github/workflows/r22_daily_16utc_regime_field.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '20260731'

jobs:
  tribunal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen exposed R20 event calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r22_r20
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lhadj88/quantum-core-v10/actions/artifacts/8781320150/zip -o /tmp/r20.zip
          unzip -q /tmp/r20.zip -d /tmp/r22_r20
          TARGETS=$(find /tmp/r22_r20 -type f -name '01_EVENT_TARGETS.csv' | head -n 1)
          test -n "${TARGETS}"
          cp "${TARGETS}" research/r22_daily_16utc_regime_field/01_EVENT_TARGETS.csv
          sha256sum research/r22_daily_16utc_regime_field/01_EVENT_TARGETS.csv
      - name: Verify modules
        run: |
          python -m py_compile research/r22_daily_16utc_regime_field/r22_data.py
          python -m py_compile research/r22_daily_16utc_regime_field/r22_state.py
          python -m py_compile research/r22_daily_16utc_regime_field/r22_models.py
          python -m py_compile research/r22_daily_16utc_regime_field/run_r22.py
          python -m py_compile research/r22_daily_16utc_regime_field/run_r22_aligned.py
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r research/r22_daily_16utc_regime_field/requirements.txt
      - name: Execute R22 tribunal
        working-directory: research/r22_daily_16utc_regime_field
        run: python run_r22_aligned.py
      - name: Move evidence to repository root
        if: always()
        run: |
          if [ -d research/r22_daily_16utc_regime_field/artifacts/r22_daily_16utc_regime_field_v0_1 ]; then
            mkdir -p artifacts
            cp -R research/r22_daily_16utc_regime_field/artifacts/r22_daily_16utc_regime_field_v0_1 artifacts/
          fi
      - name: Package evidence
        if: always()
        run: |
          if [ -d artifacts/r22_daily_16utc_regime_field_v0_1 ]; then
            tar -czf R22_DAILY_16UTC_REGIME_FIELD_v0_1.tar.gz artifacts/r22_daily_16utc_regime_field_v0_1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R22_DAILY_16UTC_REGIME_FIELD_v0_1
          path: |
            artifacts/r22_daily_16utc_regime_field_v0_1
            R22_DAILY_16UTC_REGIME_FIELD_v0_1.tar.gz
          if-no-files-found: error
          retention-days: 30
